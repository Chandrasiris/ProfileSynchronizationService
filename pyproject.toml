[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "profile-synchronization-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.13,<2", "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "python-multipart>=0.0.18,<1", "httpx>=0.27,<1", "phonenumbers>=8.13,<10", "email-validator>=2,<3", "PyJWT[crypto]>=2.10,<3", "azure-identity>=1.19,<2", "azure-storage-blob>=12,<13", "azure-storage-queue>=12,<13"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff", "pip-audit", "pip-tools"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
